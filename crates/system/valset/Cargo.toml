[package]
name = "valset"
version.workspace = true
edition.workspace = true

# The types, the rules over `store` and the ask another program makes of
# valset (`role`) are always built; a view links them with `program` off.
# `program` adds its wasm exports
# (`program::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate\'s wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
abi = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
program = { workspace = true }
# a Programs motion's op is the programs role's: its height is checked at the vote
programs = { workspace = true }
# a Halo motion's op is the halo role's: what it names is checked at the vote
halo = { workspace = true }
store = { workspace = true }
