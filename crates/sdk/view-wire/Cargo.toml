# The wire between the gpui host and a ducktape view running in wasm: a widget
# tree out, meaning-level events in, requests and responses beside. The guest
# half is here (`view-guest` and the views under `crates/app/*-view`); the host
# half is the app repo, which pins this crate by git rev. The format is ours,
# and `tests/golden.rs` holds its bytes: a shape change trips the golden and
# starts a new `WIRE_EPOCH`, which is what a host checks a view's `.wasm` against
# before running it.
[package]
name = "view-wire"
version.workspace = true
edition.workspace = true

[features]
# Reads the manifest custom section out of a built view: host-only, so the
# guests skip `wasmparser` entirely.
manifest = ["dep:wasmparser"]
# Derives a view's snapshot layout from its own serde impls. A dev-dependency
# feature: the tracer never enters wasm, so a guest builds without either crate.
schema = ["dep:serde-reflection", "dep:sha2"]

[dependencies]
wasmparser = { version = "0.251", optional = true }
serde-reflection = { version = "0.6", optional = true }
sha2 = { workspace = true, optional = true }
serde.workspace = true
gpui.workspace = true
# No code use: enables serde on gpui's re-exported accesskit Role, Toggled and
# Orientation, which `Interactivity` and `Aria` serialize.
accesskit = { version = "0.24.0", features = ["serde"] }
rmp-serde = "1"
borsh.workspace = true
slotmap = "1.0.6"
uuid = "1.1.2"
# `task` and `subscription` share the SDK futures runtime.
futures.workspace = true
# `Error` is the one error type: the same for an error a module wrote and one
# the host wrote.
error = { workspace = true, features = ["serde"] }
# `module.describe` answers what a program says its op means.
describe = { workspace = true, features = ["serde"] }
memchr = "2"
unicode-segmentation = "1"

# Honor the actual Serde shapes in guests without carrying unrelated parser arms.
# Native hosts retain the full MessagePack deserializer.
[target.'cfg(target_family = "wasm")'.dependencies]
rmp-serde = { version = "1", features = ["typed"] }

[dev-dependencies]
# The readable twin of the golden fixtures.
serde_json.workspace = true
