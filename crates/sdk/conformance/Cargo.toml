[package]
name = "conformance"
version.workspace = true
edition.workspace = true

# The role conformance suite: drives a program's native `program::Program` over
# `MockHost` with the role's own bytes. Native only (MockHost is), so a
# program takes it as a dev-dependency.
[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
program = { workspace = true }

# The suite proven on the reference programs (tests/).
[dev-dependencies]
awaits = { workspace = true }
blob = { workspace = true }
blobs = { workspace = true }
halo = { workspace = true }
identity = { workspace = true }
valset = { workspace = true }
programs = { workspace = true }
scheduler = { workspace = true }
