# The view half of the view wire: gpui-shaped contexts, host methods, editor
# primitives and typed tests. The host half lives in the app repo.
[package]
name = "view"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "The view half of the view wire: gpui-shaped contexts, elements and host methods for a wasm view"

[features]
# `live`: the fake node a view runs against outside a network
# (`view::live`): a native chain of the real programs behind
# the node's own HTTP surface, and the same chain behind `FakeHost` for a
# test. Never on in a wasm build: a view enables it as a dev-dependency.
live = [
    "dep:identity",
    "dep:valset",
    "dep:programs",
    "dep:commonware-cryptography",
    "dep:keyscheme",
    "dep:sha1",
    "dep:sha2",
    "dep:base64",
    "dep:serde_json",
]

[dependencies]
error = { workspace = true }
borsh.workspace = true
futures.workspace = true
view-wire.workspace = true
program.workspace = true
# `PageResponse`, the reply `Host::query_all` walks
store.workspace = true
design.workspace = true
serde.workspace = true
gpui.workspace = true
view-derive = { path = "../view-derive" }
unicode-segmentation = "1"
# the `live` feature alone
identity = { workspace = true, optional = true }
valset = { workspace = true, optional = true }
programs = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true }
keyscheme = { workspace = true, optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "exported_view"
crate-type = ["cdylib"]
