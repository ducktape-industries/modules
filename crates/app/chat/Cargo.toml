[package]
name = "chat"
version.workspace = true
edition.workspace = true

# The types and rules are always built; the view links them with `module`
# off. `module` adds its wasm exports
# (`guest::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
module = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no module, no imports.
describe = []

[dependencies]
abi = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
guest = { workspace = true, features = ["serde"] }
# `#[derive(program::Ask)]` on `Query`
program = { workspace = true }
serde = { workspace = true }
store = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
store = { workspace = true }
