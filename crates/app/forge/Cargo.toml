[package]
name = "forge"
edition.workspace = true
version.workspace = true

# The types and rules are always built and run natively over `guest::MockHost`;
# `forge-view` links them with `module` off. `module` adds its wasm exports
# (`guest::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
module = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no module, no imports.
describe = []

[dependencies]
abi = { workspace = true }
describe = { workspace = true }
guest = { workspace = true, features = ["serde"] }
borsh = { workspace = true }
chat = { workspace = true }
gitcore = { workspace = true }
store = { workspace = true }

[dev-dependencies]
sha2 = { version = "0.10", default-features = false }
