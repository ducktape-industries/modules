[package]
name = "node-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures.workspace = true
# `abi::hex` is how a key reaches the screen.
abi.workspace = true
ducktape-view-guest.workspace = true
# who operates a node (an agent's manager) and the roster a change names
identity.workspace = true
module-registry.workspace = true
valset.workspace = true
serde.workspace = true

[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
ducktape-view-guest = { workspace = true, features = ["live"] }
serde_json.workspace = true
